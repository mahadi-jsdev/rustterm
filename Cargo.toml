[package]
name = "rustterm"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
vt100 = "0.16"
tui-term = { version = "0.3", features = ["vt100"] }
anyhow = "1"
regex = "1"
notify-rust = "4"
ignore = "0.4"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nix = { version = "0.30", features = ["process", "fs", "socket", "uio", "term", "poll"] }
