[package]
name = "rustterm"
version = "0.2.0"
edition = "2021"
description = "A terminal workspace for humans and AI agents — multi-project TUI multiplexer with PTY panes, popups, git tooling, and mouse support"
license = "MIT"
repository = "https://github.com/mahadi-jsdev/rustterm"
homepage = "https://github.com/mahadi-jsdev/rustterm"
keywords = ["terminal", "multiplexer", "tui", "pty", "git"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
vt100 = "0.16"
tui-term = { version = "0.3", features = ["vt100"] }
anyhow = "1"
regex = "1"
notify-rust = "4"
ignore = "0.4"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nix = { version = "0.30", features = ["process", "fs", "socket", "uio", "term", "poll"] }
